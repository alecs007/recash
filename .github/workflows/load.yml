name: Load test

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Target base URL (e.g. https://staging.recash.ro)"
        required: true
        type: string
      scenario:
        description: "Which scenario to run"
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - load
          - stress
          - spike
          - ratelimit

jobs:
  k6:
    name: k6 (${{ inputs.scenario }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run k6
        uses: grafana/k6-action@v0.3.1
        with:
          filename: load/${{ inputs.scenario }}.js
        env:
          BASE_URL: ${{ inputs.base_url }}
